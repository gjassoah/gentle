<title id="title">Surface of genus 2, with 8 boundary components and 3 punctures</title>
<desc id="desc">APS standard surface layout. 2 handles on the left with alpha and beta curves; 8 boundary circles at the upper right and 3 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
