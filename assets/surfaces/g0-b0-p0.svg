<svg xmlns="http://www.w3.org/2000/svg" width="340" height="410" viewBox="0 0 340 410" role="img" aria-labelledby="title desc">
<title id="title">Surface of genus 0, with 0 boundary components and 0 punctures</title>
<desc id="desc">APS standard surface layout. Symmetric genus-zero surface; 0 boundary circles above and 0 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
<style>.body{fill:url(#surface-fill);stroke:#005075;stroke-width:1.3}.opening{fill:#ffffff;stroke:#005075;stroke-width:1.3}.curve{fill:none;stroke:#005075;stroke-width:1.6}.alpha{stroke:#002333}.beta{stroke:#337491}.hidden{stroke-dasharray:4 4;opacity:.7}.label{font:italic 19px Georgia,serif;fill:#1f2a30}.alpha-label{fill:#002333}.beta-label{fill:#337491}.arrow{fill:#005075}.arrow-alpha{fill:#002333}.arrow-beta{fill:#337491}</style>
<defs><linearGradient id="surface-fill" x2="0" y2="1"><stop stop-color="#b3cbd6"/><stop offset="1" stop-color="#e6eef1"/></linearGradient><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-alpha" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-alpha" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-beta" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-beta" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker></defs>
