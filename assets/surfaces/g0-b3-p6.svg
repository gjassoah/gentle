<title id="title">Surface of genus 0, with 3 boundary components and 6 punctures</title>
<desc id="desc">APS standard surface layout. Symmetric genus-zero surface; 3 boundary circles above and 6 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
