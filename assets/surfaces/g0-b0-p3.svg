<text x="335" y="316" class="label ">c<tspan baseline-shift="sub" font-size="12">2</tspan></text>
</g>
<g data-puncture="3"><circle class="opening" cx="427.5" cy="355" r="3"/><ellipse class="curve hidden" cx="427.5" cy="307" rx="15" ry="6"/><path class="curve" d="M 412.5 307 A 15 6 0 0 0 442.5 307"/><path class="curve" d="M 431.5 313 L 423.5 313" marker-end="url(#arrow)"/>
