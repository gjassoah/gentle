<title id="title">Surface of genus 3, with 0 boundary components and 5 punctures</title>
<desc id="desc">APS standard surface layout. 3 handles on the left with alpha and beta curves; 0 boundary circles at the upper right and 5 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
