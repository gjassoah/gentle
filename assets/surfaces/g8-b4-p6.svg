<title id="title">Surface of genus 8, with 4 boundary components and 6 punctures</title>
<desc id="desc">APS standard surface layout. 8 handles on the left with alpha and beta curves; 4 boundary circles at the upper right and 6 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
