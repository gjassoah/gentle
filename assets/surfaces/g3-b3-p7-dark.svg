<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="410" viewBox="0 0 1890 410" role="img" aria-labelledby="title desc">
<title id="title">Surface of genus 3, with 3 boundary components and 7 punctures</title>
<desc id="desc">APS standard surface layout. 3 handles on the left with alpha and beta curves; 3 boundary circles at the upper right and 7 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
