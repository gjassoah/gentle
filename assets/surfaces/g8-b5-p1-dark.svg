<title id="title">Surface of genus 8, with 5 boundary components and 1 punctures</title>
<desc id="desc">APS standard surface layout. 8 handles on the left with alpha and beta curves; 5 boundary circles at the upper right and 1 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
