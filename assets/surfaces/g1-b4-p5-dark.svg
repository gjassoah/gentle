<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="410" viewBox="0 0 1110 410" role="img" aria-labelledby="title desc">
<title id="title">Surface of genus 1, with 4 boundary components and 5 punctures</title>
<desc id="desc">APS standard surface layout. 1 handles on the left with alpha and beta curves; 4 boundary circles at the upper right and 5 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
