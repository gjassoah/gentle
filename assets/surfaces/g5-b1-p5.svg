<title id="title">Surface of genus 5, with 1 boundary components and 5 punctures</title>
<desc id="desc">APS standard surface layout. 5 handles on the left with alpha and beta curves; 1 boundary circles at the upper right and 5 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
