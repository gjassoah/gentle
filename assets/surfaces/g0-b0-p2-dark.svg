<svg xmlns="http://www.w3.org/2000/svg" width="480" height="410" viewBox="0 0 480 410" role="img" aria-labelledby="title desc">
<title id="title">Surface of genus 0, with 0 boundary components and 2 punctures</title>
<desc id="desc">APS standard surface layout. Symmetric genus-zero surface; 0 boundary circles above and 2 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
<style>.body{fill:url(#surface-fill);stroke:#9bc7ac;stroke-width:1.3}.opening{fill:#1d2521;stroke:#9bc7ac;stroke-width:1.3}.curve{fill:none;stroke:#9bc7ac;stroke-width:1.6}.alpha{stroke:#d0ead8}.beta{stroke:#80cdbd}.hidden{stroke-dasharray:4 4;opacity:.7}.label{font:italic 19px Georgia,serif;fill:#e4e9e1}.alpha-label{fill:#d0ead8}.beta-label{fill:#80cdbd}.arrow{fill:#9bc7ac}.arrow-alpha{fill:#d0ead8}.arrow-beta{fill:#80cdbd}</style>
<defs><linearGradient id="surface-fill" x2="0" y2="1"><stop stop-color="#456951"/><stop offset="1" stop-color="#283d30"/></linearGradient><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-alpha" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-alpha" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-beta" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-beta" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker></defs>
<rect width="480" height="410" fill="#1d2521"/>
<path d="M 90 200 L 390 200 C 417.614 200 440 217.909 440 240 C 440 262.091 417.614 280 390 280 L 340 280 C 300 280 294 320 293 354 Q 290 360 287 354 C 286 320 280 280 240 280 L 240 280 C 200 280 194 320 193 354 Q 190 360 187 354 C 186 320 180 280 140 280 L 90 280 C 62.386 280 40 262.091 40 240 C 40 217.909 62.386 200 90 200 Z" class="body"/>
<g data-puncture="1"><circle class="opening" cx="190" cy="355" r="3"/><ellipse class="curve hidden" cx="190" cy="307" rx="15" ry="6"/><path class="curve" d="M 175 307 A 15 6 0 0 0 205 307"/><path class="curve" d="M 194 313 L 186 313" marker-end="url(#arrow)"/>
<text x="210" y="316" class="label ">c<tspan baseline-shift="sub" font-size="12">1</tspan></text>
</g>
<g data-puncture="2"><circle class="opening" cx="290" cy="355" r="3"/><ellipse class="curve hidden" cx="290" cy="307" rx="15" ry="6"/><path class="curve" d="M 275 307 A 15 6 0 0 0 305 307"/><path class="curve" d="M 294 313 L 286 313" marker-end="url(#arrow)"/>
<text x="310" y="316" class="label ">c<tspan baseline-shift="sub" font-size="12">2</tspan></text>
</g>
</svg>