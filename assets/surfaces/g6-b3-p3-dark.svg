<svg xmlns="http://www.w3.org/2000/svg" width="2010" height="410" viewBox="0 0 2010 410" role="img" aria-labelledby="title desc">
<title id="title">Surface of genus 6, with 3 boundary components and 3 punctures</title>
<desc id="desc">APS standard surface layout. 6 handles on the left with alpha and beta curves; 3 boundary circles at the upper right and 3 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
