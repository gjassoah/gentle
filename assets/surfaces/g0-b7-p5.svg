<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="410" viewBox="0 0 1230 410" role="img" aria-labelledby="title desc">
<title id="title">Surface of genus 0, with 7 boundary components and 5 punctures</title>
<desc id="desc">APS standard surface layout. Symmetric genus-zero surface; 7 boundary circles above and 5 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
