<title id="title">Surface of genus 0, with 4 boundary components and 8 punctures</title>
<desc id="desc">APS standard surface layout. Symmetric genus-zero surface; 4 boundary circles above and 8 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
