<text x="260" y="316" class="label ">c<tspan baseline-shift="sub" font-size="12">4</tspan></text>
</g>
<g data-puncture="2"><circle class="opening" cx="390" cy="355" r="3"/><ellipse class="curve hidden" cx="390" cy="307" rx="15" ry="6"/><path class="curve" d="M 375 307 A 15 6 0 0 0 405 307"/><path class="curve" d="M 394 313 L 386 313" marker-end="url(#arrow)"/>
