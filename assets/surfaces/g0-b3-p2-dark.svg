<svg xmlns="http://www.w3.org/2000/svg" width="630" height="410" viewBox="0 0 630 410" role="img" aria-labelledby="title desc">
<title id="title">Surface of genus 0, with 3 boundary components and 2 punctures</title>
<desc id="desc">APS standard surface layout. Symmetric genus-zero surface; 3 boundary circles above and 2 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
<style>.body{fill:url(#surface-fill);stroke:#9bc7ac;stroke-width:1.3}.opening{fill:#1d2521;stroke:#9bc7ac;stroke-width:1.3}.curve{fill:none;stroke:#9bc7ac;stroke-width:1.6}.alpha{stroke:#d0ead8}.beta{stroke:#80cdbd}.hidden{stroke-dasharray:4 4;opacity:.7}.label{font:italic 19px Georgia,serif;fill:#e4e9e1}.alpha-label{fill:#d0ead8}.beta-label{fill:#80cdbd}.arrow{fill:#9bc7ac}.arrow-alpha{fill:#d0ead8}.arrow-beta{fill:#80cdbd}</style>
<defs><linearGradient id="surface-fill" x2="0" y2="1"><stop stop-color="#456951"/><stop offset="1" stop-color="#283d30"/></linearGradient><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-alpha" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-alpha" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-beta" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-beta" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker></defs>
<rect width="630" height="410" fill="#1d2521"/>
<path d="M 90 200 L 147.5 200 C 172.5 200 172.5 140 172.5 85 L 232.5 85 C 232.5 140 232.5 200 257.5 200 L 260 200 C 285 200 285 140 285 85 L 345 85 C 345 140 345 200 370 200 L 372.5 200 C 397.5 200 397.5 140 397.5 85 L 457.5 85 C 457.5 140 457.5 200 482.5 200 L 540 200 C 567.614 200 590 217.909 590 240 C 590 262.091 567.614 280 540 280 L 445 280 C 400 280 394 320 393 354 Q 390 360 387 354 C 386 320 380 280 335 280 L 295 280 C 250 280 244 320 243 354 Q 240 360 237 354 C 236 320 230 280 185 280 L 90 280 C 62.386 280 40 262.091 40 240 C 40 217.909 62.386 200 90 200 Z" class="body"/>
<g data-boundary="1"><ellipse class="opening" cx="202.5" cy="85" rx="30" ry="10"/><ellipse class="curve hidden" cx="202.5" cy="115" rx="33" ry="11"/><path class="curve" d="M 169.5 115 A 33 11 0 0 0 235.5 115"/><path class="curve" d="M 207.5 126 L 197.5 126" marker-end="url(#arrow)"/>
<text x="180.5" y="65" class="label ">∂<tspan baseline-shift="sub" font-size="12">1</tspan></text>
<text x="194.5" y="150" class="label ">c<tspan baseline-shift="sub" font-size="12">1</tspan></text>
</g>
<g data-boundary="2"><ellipse class="opening" cx="315" cy="85" rx="30" ry="10"/><ellipse class="curve hidden" cx="315" cy="115" rx="33" ry="11"/><path class="curve" d="M 282 115 A 33 11 0 0 0 348 115"/><path class="curve" d="M 320 126 L 310 126" marker-end="url(#arrow)"/>
<text x="293" y="65" class="label ">∂<tspan baseline-shift="sub" font-size="12">2</tspan></text>
<text x="307" y="150" class="label ">c<tspan baseline-shift="sub" font-size="12">2</tspan></text>
</g>
<g data-boundary="3"><ellipse class="opening" cx="427.5" cy="85" rx="30" ry="10"/><ellipse class="curve hidden" cx="427.5" cy="115" rx="33" ry="11"/><path class="curve" d="M 394.5 115 A 33 11 0 0 0 460.5 115"/><path class="curve" d="M 432.5 126 L 422.5 126" marker-end="url(#arrow)"/>
<text x="405.5" y="65" class="label ">∂<tspan baseline-shift="sub" font-size="12">3</tspan></text>
<text x="419.5" y="150" class="label ">c<tspan baseline-shift="sub" font-size="12">3</tspan></text>
</g>
