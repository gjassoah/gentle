<svg xmlns="http://www.w3.org/2000/svg" width="480" height="410" viewBox="0 0 480 410" role="img" aria-labelledby="title desc">
<title id="title">Surface of genus 0, with 1 boundary components and 2 punctures</title>
<desc id="desc">APS standard surface layout. Symmetric genus-zero surface; 1 boundary circles above and 2 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
<style>.body{fill:url(#surface-fill);stroke:#2b6555;stroke-width:1.3}.opening{fill:#ffffff;stroke:#2b6555;stroke-width:1.3}.curve{fill:none;stroke:#2b6555;stroke-width:1.6}.alpha{stroke:#20563f}.beta{stroke:#397d77}.hidden{stroke-dasharray:4 4;opacity:.7}.label{font:italic 19px Georgia,serif;fill:#282e2a}.alpha-label{fill:#20563f}.beta-label{fill:#397d77}.arrow{fill:#2b6555}.arrow-alpha{fill:#20563f}.arrow-beta{fill:#397d77}</style>
<defs><linearGradient id="surface-fill" x2="0" y2="1"><stop stop-color="#b4cdbb"/><stop offset="1" stop-color="#edf4ee"/></linearGradient><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-alpha" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-alpha" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-beta" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-beta" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker></defs>
<rect width="480" height="410" fill="#ffffff"/>
<path d="M 90 200 L 185 200 C 210 200 210 140 210 85 L 270 85 C 270 140 270 200 295 200 L 390 200 C 417.614 200 440 217.909 440 240 C 440 262.091 417.614 280 390 280 L 340 280 C 300 280 294 320 293 354 Q 290 360 287 354 C 286 320 280 280 240 280 L 240 280 C 200 280 194 320 193 354 Q 190 360 187 354 C 186 320 180 280 140 280 L 90 280 C 62.386 280 40 262.091 40 240 C 40 217.909 62.386 200 90 200 Z" class="body"/>
<g data-boundary="1"><ellipse class="opening" cx="240" cy="85" rx="30" ry="10"/><ellipse class="curve hidden" cx="240" cy="115" rx="33" ry="11"/><path class="curve" d="M 207 115 A 33 11 0 0 0 273 115"/><path class="curve" d="M 245 126 L 235 126" marker-end="url(#arrow)"/>
<text x="218" y="65" class="label ">∂<tspan baseline-shift="sub" font-size="12">1</tspan></text>
<text x="232" y="150" class="label ">c<tspan baseline-shift="sub" font-size="12">1</tspan></text>
</g>
<g data-puncture="1"><circle class="opening" cx="190" cy="355" r="3"/><ellipse class="curve hidden" cx="190" cy="307" rx="15" ry="6"/><path class="curve" d="M 175 307 A 15 6 0 0 0 205 307"/><path class="curve" d="M 194 313 L 186 313" marker-end="url(#arrow)"/>
<text x="210" y="316" class="label ">c<tspan baseline-shift="sub" font-size="12">2</tspan></text>
</g>
<g data-puncture="2"><circle class="opening" cx="290" cy="355" r="3"/><ellipse class="curve hidden" cx="290" cy="307" rx="15" ry="6"/><path class="curve" d="M 275 307 A 15 6 0 0 0 305 307"/><path class="curve" d="M 294 313 L 286 313" marker-end="url(#arrow)"/>
<text x="310" y="316" class="label ">c<tspan baseline-shift="sub" font-size="12">3</tspan></text>
</g>
</svg>