<svg xmlns="http://www.w3.org/2000/svg" width="480" height="410" viewBox="0 0 480 410" role="img" aria-labelledby="title desc">
<title id="title">Surface of genus 0, with 2 boundary components and 0 punctures</title>
<desc id="desc">APS standard surface layout. Symmetric genus-zero surface; 2 boundary circles above and 0 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
<style>.body{fill:url(#surface-fill);stroke:#9bc7ac;stroke-width:1.3}.opening{fill:#1d2521;stroke:#9bc7ac;stroke-width:1.3}.curve{fill:none;stroke:#9bc7ac;stroke-width:1.6}.alpha{stroke:#d0ead8}.beta{stroke:#80cdbd}.hidden{stroke-dasharray:4 4;opacity:.7}.label{font:italic 19px Georgia,serif;fill:#e4e9e1}.alpha-label{fill:#d0ead8}.beta-label{fill:#80cdbd}.arrow{fill:#9bc7ac}.arrow-alpha{fill:#d0ead8}.arrow-beta{fill:#80cdbd}</style>
<defs><linearGradient id="surface-fill" x2="0" y2="1"><stop stop-color="#456951"/><stop offset="1" stop-color="#283d30"/></linearGradient><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-alpha" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-alpha" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-beta" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-beta" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker></defs>
<rect width="480" height="410" fill="#1d2521"/>
<path d="M 90 200 L 140 200 C 160 200 160 140 160 85 L 220 85 C 220 140 220 200 240 200 L 240 200 C 260 200 260 140 260 85 L 320 85 C 320 140 320 200 340 200 L 390 200 C 417.614 200 440 217.909 440 240 C 440 262.091 417.614 280 390 280 L 90 280 C 62.386 280 40 262.091 40 240 C 40 217.909 62.386 200 90 200 Z" class="body"/>
<g data-boundary="1"><ellipse class="opening" cx="190" cy="85" rx="30" ry="10"/><ellipse class="curve hidden" cx="190" cy="115" rx="33" ry="11"/><path class="curve" d="M 157 115 A 33 11 0 0 0 223 115"/><path class="curve" d="M 195 126 L 185 126" marker-end="url(#arrow)"/>
<text x="168" y="65" class="label ">∂<tspan baseline-shift="sub" font-size="12">1</tspan></text>
<text x="182" y="150" class="label ">c<tspan baseline-shift="sub" font-size="12">1</tspan></text>
</g>
