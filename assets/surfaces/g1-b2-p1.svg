</g>
<g data-boundary="1"><ellipse class="opening" cx="376.6666666666667" cy="85" rx="30" ry="10"/><ellipse class="curve hidden" cx="376.6666666666667" cy="115" rx="33" ry="11"/><path class="curve" d="M 343.6666666666667 115 A 33 11 0 0 0 409.6666666666667 115"/><path class="curve" d="M 381.6666666666667 126 L 371.6666666666667 126" marker-end="url(#arrow)"/>
