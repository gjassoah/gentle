<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="410" viewBox="0 0 1410 410" role="img" aria-labelledby="title desc">
<title id="title">Surface of genus 1, with 7 boundary components and 4 punctures</title>
<desc id="desc">APS standard surface layout. 1 handles on the left with alpha and beta curves; 7 boundary circles at the upper right and 4 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
<style>.body{fill:url(#surface-fill);stroke:#2b6555;stroke-width:1.3}.opening{fill:#ffffff;stroke:#2b6555;stroke-width:1.3}.curve{fill:none;stroke:#2b6555;stroke-width:1.6}.alpha{stroke:#20563f}.beta{stroke:#397d77}.hidden{stroke-dasharray:4 4;opacity:.7}.label{font:italic 19px Georgia,serif;fill:#282e2a}.alpha-label{fill:#20563f}.beta-label{fill:#397d77}.arrow{fill:#2b6555}.arrow-alpha{fill:#20563f}.arrow-beta{fill:#397d77}</style>
