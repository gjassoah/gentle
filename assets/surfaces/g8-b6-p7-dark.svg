<title id="title">Surface of genus 8, with 6 boundary components and 7 punctures</title>
<desc id="desc">APS standard surface layout. 8 handles on the left with alpha and beta curves; 6 boundary circles at the upper right and 7 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
