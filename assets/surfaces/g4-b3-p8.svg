<title id="title">Surface of genus 4, with 3 boundary components and 8 punctures</title>
<desc id="desc">APS standard surface layout. 4 handles on the left with alpha and beta curves; 3 boundary circles at the upper right and 8 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
