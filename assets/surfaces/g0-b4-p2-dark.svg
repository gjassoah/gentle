<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410" role="img" aria-labelledby="title desc">
<title id="title">Surface of genus 0, with 4 boundary components and 2 punctures</title>
<desc id="desc">APS standard surface layout. Symmetric genus-zero surface; 4 boundary circles above and 2 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
<style>.body{fill:url(#surface-fill);stroke:#9bc7ac;stroke-width:1.3}.opening{fill:#1d2521;stroke:#9bc7ac;stroke-width:1.3}.curve{fill:none;stroke:#9bc7ac;stroke-width:1.6}.alpha{stroke:#d0ead8}.beta{stroke:#80cdbd}.hidden{stroke-dasharray:4 4;opacity:.7}.label{font:italic 19px Georgia,serif;fill:#e4e9e1}.alpha-label{fill:#d0ead8}.beta-label{fill:#80cdbd}.arrow{fill:#9bc7ac}.arrow-alpha{fill:#d0ead8}.arrow-beta{fill:#80cdbd}</style>
<defs><linearGradient id="surface-fill" x2="0" y2="1"><stop stop-color="#456951"/><stop offset="1" stop-color="#283d30"/></linearGradient><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-alpha" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-alpha" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-beta" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-beta" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker></defs>
<rect width="780" height="410" fill="#1d2521"/>
<path d="M 90 200 L 155 200 C 180 200 180 140 180 85 L 240 85 C 240 140 240 200 265 200 L 275 200 C 300 200 300 140 300 85 L 360 85 C 360 140 360 200 385 200 L 395 200 C 420 200 420 140 420 85 L 480 85 C 480 140 480 200 505 200 L 515 200 C 540 200 540 140 540 85 L 600 85 C 600 140 600 200 625 200 L 690 200 C 717.614 200 740 217.909 740 240 C 740 262.091 717.614 280 690 280 L 545 280 C 500 280 494 320 493 354 Q 490 360 487 354 C 486 320 480 280 435 280 L 345 280 C 300 280 294 320 293 354 Q 290 360 287 354 C 286 320 280 280 235 280 L 90 280 C 62.386 280 40 262.091 40 240 C 40 217.909 62.386 200 90 200 Z" class="body"/>
<g data-boundary="1"><ellipse class="opening" cx="210" cy="85" rx="30" ry="10"/><ellipse class="curve hidden" cx="210" cy="115" rx="33" ry="11"/><path class="curve" d="M 177 115 A 33 11 0 0 0 243 115"/><path class="curve" d="M 215 126 L 205 126" marker-end="url(#arrow)"/>
