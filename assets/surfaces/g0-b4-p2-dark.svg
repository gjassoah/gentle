<text x="308" y="65" class="label ">∂<tspan baseline-shift="sub" font-size="12">2</tspan></text>
<text x="322" y="150" class="label ">c<tspan baseline-shift="sub" font-size="12">2</tspan></text>
</g>
<g data-boundary="3"><ellipse class="opening" cx="450" cy="85" rx="30" ry="10"/><ellipse class="curve hidden" cx="450" cy="115" rx="33" ry="11"/><path class="curve" d="M 417 115 A 33 11 0 0 0 483 115"/><path class="curve" d="M 455 126 L 445 126" marker-end="url(#arrow)"/>
