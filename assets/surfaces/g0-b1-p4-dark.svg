<text x="230" y="316" class="label ">c<tspan baseline-shift="sub" font-size="12">2</tspan></text>
</g>
<g data-puncture="2"><circle class="opening" cx="330" cy="355" r="3"/><ellipse class="curve hidden" cx="330" cy="307" rx="15" ry="6"/><path class="curve" d="M 315 307 A 15 6 0 0 0 345 307"/><path class="curve" d="M 334 313 L 326 313" marker-end="url(#arrow)"/>
<text x="350" y="316" class="label ">c<tspan baseline-shift="sub" font-size="12">3</tspan></text>
