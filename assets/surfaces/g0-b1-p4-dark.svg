<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410" role="img" aria-labelledby="title desc">
<title id="title">Surface of genus 0, with 1 boundary components and 4 punctures</title>
<desc id="desc">APS standard surface layout. Symmetric genus-zero surface; 1 boundary circles above and 4 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
<style>.body{fill:url(#surface-fill);stroke:#9bc7ac;stroke-width:1.3}.opening{fill:#1d2521;stroke:#9bc7ac;stroke-width:1.3}.curve{fill:none;stroke:#9bc7ac;stroke-width:1.6}.alpha{stroke:#d0ead8}.beta{stroke:#80cdbd}.hidden{stroke-dasharray:4 4;opacity:.7}.label{font:italic 19px Georgia,serif;fill:#e4e9e1}.alpha-label{fill:#d0ead8}.beta-label{fill:#80cdbd}.arrow{fill:#9bc7ac}.arrow-alpha{fill:#d0ead8}.arrow-beta{fill:#80cdbd}</style>
<defs><linearGradient id="surface-fill" x2="0" y2="1"><stop stop-color="#456951"/><stop offset="1" stop-color="#283d30"/></linearGradient><marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-alpha" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-alpha" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker><marker id="arrow-beta" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow-beta" d="M 1 1 L 7 4 L 1 7 L 3 4 Z"/></marker></defs>
<rect width="780" height="410" fill="#1d2521"/>
<path d="M 90 200 L 335 200 C 360 200 360 140 360 85 L 420 85 C 420 140 420 200 445 200 L 690 200 C 717.614 200 740 217.909 740 240 C 740 262.091 717.614 280 690 280 L 625 280 C 580 280 574 320 573 354 Q 570 360 567 354 C 566 320 560 280 515 280 L 505 280 C 460 280 454 320 453 354 Q 450 360 447 354 C 446 320 440 280 395 280 L 385 280 C 340 280 334 320 333 354 Q 330 360 327 354 C 326 320 320 280 275 280 L 265 280 C 220 280 214 320 213 354 Q 210 360 207 354 C 206 320 200 280 155 280 L 90 280 C 62.386 280 40 262.091 40 240 C 40 217.909 62.386 200 90 200 Z" class="body"/>
<g data-boundary="1"><ellipse class="opening" cx="390" cy="85" rx="30" ry="10"/><ellipse class="curve hidden" cx="390" cy="115" rx="33" ry="11"/><path class="curve" d="M 357 115 A 33 11 0 0 0 423 115"/><path class="curve" d="M 395 126 L 385 126" marker-end="url(#arrow)"/>
<text x="368" y="65" class="label ">∂<tspan baseline-shift="sub" font-size="12">1</tspan></text>
<text x="382" y="150" class="label ">c<tspan baseline-shift="sub" font-size="12">1</tspan></text>
</g>
