<title id="title">Surface of genus 6, with 2 boundary components and 0 punctures</title>
<desc id="desc">APS standard surface layout. 6 handles on the left with alpha and beta curves; 2 boundary circles at the upper right and 0 punctures below. Marked points are omitted. Dashed segments lie on the hidden sheet. The alpha and beta curves form a symplectic basis after capping boundaries and filling punctures.</desc>
